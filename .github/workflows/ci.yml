name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,ml]"
      - run: python -m ruff check .
      - run: python -m pytest
      - name: Verify committed web exports
        if: matrix.python-version == '3.12'
        run: |
          export_dir="$(mktemp -d)"
          quant-research export-web --output-dir "$export_dir"
          diff --recursive --brief web/public/data "$export_dir"

  dashboard:
    name: Next.js dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build -- --webpack

  containers:
    name: Production containers
    if: github.event_name != 'pull_request'
    needs: [python, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose build
