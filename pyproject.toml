[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "institutional-quant-research-platform"
version = "0.12.0"
description = "Leakage-aware, reproducible cross-sectional equity research platform."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [{name = "Research Platform Author"}]
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=3.0,<3.1",
  "pyarrow>=18,<25",
  "PyYAML>=6.0,<7",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "yfinance>=1.7,<1.8",
  "pandas-datareader>=0.11.1,<0.12",
  "scikit-learn>=1.9,<2",
  "scipy>=1.12,<2",
  "matplotlib>=3.10,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
ml = [
  "xgboost>=3.4,<4",
  "lightgbm>=4.7,<5",
  "shap>=0.52,<0.53",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.15,<3",
  "httpx>=0.28,<1",
]

[project.scripts]
quant-research = "quant_platform.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_platform"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  # Typer and FastAPI declare CLI/dependency metadata in default values.
  "B008",
  # The inherited research engine predates line-length enforcement; new 4A code is formatted.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"src/quant_platform/features/volatility.py" = ["B023"]
"src/quant_platform/ml/dataset.py" = ["B007"]
"src/quant_platform/ml/holdout.py" = ["B007"]
