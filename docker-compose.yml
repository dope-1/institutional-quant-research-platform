name: institutional-quant-platform

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: institutional-quant-api:4d
    init: true
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      QUANT_ARTIFACT_ROOT: /app/artifacts
    volumes:
      - type: bind
        source: ./artifacts
        target: /app/artifacts
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: institutional-quant-web:4d
    init: true
    restart: unless-stopped
    environment:
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
